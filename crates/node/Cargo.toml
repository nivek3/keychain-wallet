[package]
name = "wallet-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "=3.14.2", default-features = false, features = ["napi8", "serde-json", "tokio_rt"] }
napi-derive = "=3.6.12"
serde_json = "=1.0.150"
libc = "=0.2.191"
k256 = { version = "=0.13.4", default-features = false, features = ["std", "ecdsa"] }
tokio = { version = "1", features = ["rt"] }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
zeroize = "=1.8.1"

[build-dependencies]
napi-build = "=2.6.0"
